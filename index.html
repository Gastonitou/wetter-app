<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Wetter App</title>
<link rel="manifest" href="manifest.json">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Wetter">
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
  background: linear-gradient(135deg, #1e3a5f 0%, #2d5a87 50%, #1a1a2e 100%);
  color: #fff;
  min-height: 100vh;
  padding: 16px;
}
.container { max-width: 480px; margin: 0 auto; }
.search-box { display: flex; gap: 8px; margin-bottom: 24px; }
.search-box input {
  flex: 1; padding: 14px 18px; border: none; border-radius: 16px;
  background: rgba(255,255,255,0.15); backdrop-filter: blur(10px);
  color: #fff; font-size: 16px; outline: none;
}
.search-box input::placeholder { color: rgba(255,255,255,0.5); }
.search-box button {
  padding: 14px 20px; border: none; border-radius: 16px;
  background: rgba(255,255,255,0.25); color: #fff;
  font-size: 18px; cursor: pointer; transition: background 0.2s;
}
.search-box button:hover { background: rgba(255,255,255,0.35); }
.search-box button:active { transform: scale(0.95); }
.loading { text-align: center; padding: 40px; font-size: 18px; color: rgba(255,255,255,0.6); }
.hidden { display: none !important; }

.current-card {
  background: rgba(255,255,255,0.1); backdrop-filter: blur(20px);
  border-radius: 24px; padding: 32px 24px; margin-bottom: 16px;
  text-align: center; border: 1px solid rgba(255,255,255,0.1);
}
.current-card .city { font-size: 22px; font-weight: 600; margin-bottom: 4px; }
.current-card .country { font-size: 14px; color: rgba(255,255,255,0.5); margin-bottom: 16px; }
.current-card .temp { font-size: 72px; font-weight: 200; line-height: 1; margin: 8px 0; }
.current-card .condition { font-size: 18px; color: rgba(255,255,255,0.8); margin-bottom: 20px; }
.current-card .details { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; padding-top: 16px; border-top: 1px solid rgba(255,255,255,0.1); }
.current-card .detail-item { text-align: center; }
.current-card .detail-item .label { font-size: 12px; color: rgba(255,255,255,0.5); text-transform: uppercase; letter-spacing: 0.5px; }
.current-card .detail-item .value { font-size: 18px; font-weight: 500; margin-top: 4px; }

.forecast-title { font-size: 16px; font-weight: 600; margin-bottom: 12px; color: rgba(255,255,255,0.8); }
.forecast-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-bottom: 24px; }
.forecast-card { background: rgba(255,255,255,0.08); border-radius: 16px; padding: 16px 12px; text-align: center; border: 1px solid rgba(255,255,255,0.05); }
.forecast-card .day { font-size: 14px; font-weight: 600; margin-bottom: 8px; color: rgba(255,255,255,0.7); }
.forecast-card .icon { font-size: 32px; margin-bottom: 8px; }
.forecast-card .high { font-size: 20px; font-weight: 500; }
.forecast-card .low { font-size: 14px; color: rgba(255,255,255,0.5); margin-top: 2px; }

.error { background: rgba(239,68,68,0.2); border: 1px solid rgba(239,68,68,0.3); border-radius: 12px; padding: 12px 16px; margin-bottom: 16px; color: #fca5a5; font-size: 14px; }
.footer { text-align: center; font-size: 12px; color: rgba(255,255,255,0.3); margin-top: 32px; padding-bottom: 16px; }
.suggestions { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 16px; }
.suggestions button { padding: 8px 16px; border: 1px solid rgba(255,255,255,0.2); border-radius: 20px; background: rgba(255,255,255,0.08); color: rgba(255,255,255,0.7); font-size: 13px; cursor: pointer; transition: all 0.2s; }
.suggestions button:hover { background: rgba(255,255,255,0.2); color: #fff; }
.weather-icon { font-size: 64px; margin-bottom: 8px; }
</style>
</head>
<body>
<div class="container">
  <div style="display:flex;align-items:center;gap:8px;margin-bottom:16px;padding-top:8px;">
    <span style="font-size:24px;">🌤️</span>
    <span style="font-size:20px;font-weight:600;">Wetter App</span>
  </div>
  <div class="search-box">
    <input type="text" id="cityInput" placeholder="Stadt eingeben..." />
    <button id="searchBtn">🔍</button>
  </div>
  <div class="suggestions">
    <button onclick="searchCity('Tunis')">Tunis 🇹🇳</button>
    <button onclick="searchCity('Berlin')">Berlin 🇩🇪</button>
    <button onclick="searchCity('Hamburg')">Hamburg 🇩🇪</button>
    <button onclick="searchCity('München')">München 🇩🇪</button>
    <button onclick="searchCity('Paris')">Paris 🇫🇷</button>
    <button onclick="searchCity('London')">London 🇬🇧</button>
  </div>
  <div id="errorBox" class="error hidden"></div>
  <div id="loading" class="loading hidden">🌤️ Wetter wird geladen...</div>
  <div id="currentWeather" class="hidden">
    <div class="current-card">
      <div class="city" id="cityName">-</div>
      <div class="country" id="countryName">-</div>
      <div class="weather-icon" id="weatherIcon">☀️</div>
      <div class="temp"><span id="tempValue">-</span>°</div>
      <div class="condition" id="conditionText">-</div>
      <div class="details">
        <div class="detail-item"><div class="label">Gefühlt</div><div class="value" id="feelsLike">-°</div></div>
        <div class="detail-item"><div class="label">Wind</div><div class="value" id="windSpeed">- km/h</div></div>
        <div class="detail-item"><div class="label">Luft</div><div class="value" id="humidity">-%</div></div>
      </div>
    </div>
  </div>
  <div id="forecast" class="hidden">
    <div class="forecast-title">📅 3-Tage Vorhersage</div>
    <div class="forecast-grid" id="forecastGrid"></div>
  </div>
  <div class="footer">⚡ Lädt live von wttr.in — kein Server nötig</div>
</div>
<script>
function getDayName(d){return['So','Mo','Di','Mi','Do','Fr','Sa'][new Date(d).getDay()]}
function emoji(c){return{'113':'☀️','116':'⛅','119':'☁️','122':'☁️','143':'🌫️','176':'🌦️','179':'🌧️','182':'🌧️','185':'🌧️','200':'⛈️','227':'🌨️','230':'🌨️','248':'🌫️','260':'🌫️','263':'🌦️','266':'🌦️','281':'🌧️','284':'🌧️','293':'🌦️','296':'🌦️','299':'🌧️','302':'🌧️','305':'🌧️','308':'🌧️','311':'🌧️','314':'🌧️','317':'🌧️','320':'🌨️','323':'🌨️','326':'🌨️','329':'🌨️','332':'❄️','335':'❄️','338':'❄️','350':'🧊','353':'🌦️','356':'🌧️','359':'🌧️','362':'🌧️','365':'🌧️','368':'🌨️','371':'❄️','374':'🌧️','377':'🌧️','386':'⛈️','389':'⛈️','392':'⛈️','395':'❄️'}[c]||'🌤️'}
async function searchCity(city){
  if(!city)return;
  document.getElementById('cityInput').value=city;
  document.getElementById('loading').classList.remove('hidden');
  document.getElementById('currentWeather').classList.add('hidden');
  document.getElementById('forecast').classList.add('hidden');
  document.getElementById('errorBox').classList.add('hidden');
  try{
    const r=await fetch('https://wttr.in/'+encodeURIComponent(city)+'?format=j1');
    const d=await r.json();
    if(!d.current_condition) throw Error('Nicht gefunden');
    const cc=d.current_condition[0],a=d.nearest_area[0];
    document.getElementById('cityName').textContent=a.areaName[0].value;
    document.getElementById('countryName').textContent=a.country[0].value;
    document.getElementById('weatherIcon').textContent=emoji(cc.weatherCode);
    document.getElementById('tempValue').textContent=cc.temp_C;
    document.getElementById('conditionText').textContent=cc.weatherDesc[0].value;
    document.getElementById('feelsLike').textContent=cc.FeelsLikeC+'°';
    document.getElementById('windSpeed').textContent=cc.windspeedKmph+' km/h';
    document.getElementById('humidity').textContent=cc.humidity+'%';
    document.getElementById('forecastGrid').innerHTML=d.weather.slice(0,3).map(day=>
      '<div class=\"forecast-card\"><div class=\"day\">'+getDayName(day.date)+'</div><div class=\"icon\">'+emoji(day.hourly[0].weatherCode)+'</div><div class=\"high\">'+day.maxtempC+'°</div><div class=\"low\">'+day.mintempC+'°</div></div>'
    ).join('');
    document.getElementById('currentWeather').classList.remove('hidden');
    document.getElementById('forecast').classList.remove('hidden');
  }catch(e){
    document.getElementById('errorBox').textContent='❌ '+(e.message||'Fehler');
    document.getElementById('errorBox').classList.remove('hidden');
  }finally{document.getElementById('loading').classList.add('hidden')}
}
document.getElementById('searchBtn').onclick=()=>searchCity(document.getElementById('cityInput').value);
document.getElementById('cityInput').onkeypress=e=>e.key==='Enter'&&searchCity(e.target.value);
searchCity('Tunis');
</script>
</body>
</html>
